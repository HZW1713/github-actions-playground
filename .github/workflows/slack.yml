name: Post to Slack
on:
  push:
    branches:
      - test/actions

jobs:
  post_to_slack:
    runs-on: ubuntu-latest
    steps:
      - name: Generate message
        run: |
          
      - name: Post text to a Slack channel
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_APP_SECRET }}
          payload: |
            channel: C04PGT140DD
            text: "howdy <@U04PGT12X1V>! [マニュアル](https://example.com)"