name: Post to Slack
on:
  push:
    branches:
      - test/actions

jobs:
  post_to_slack:
    runs-on: ubuntu-latest
    steps:
      - name: Generate message
        id: gen_message
        run: |
          message=`cat<<-EOT
            こんにちは
            おげんきですか。
            ● これはリストです
            <https://google.com|Google>
          EOT`

          echo 'message<<EOT' >> $GITHUB_ENV
          echo "$message" >> $GITHUB_ENV
          echo 'EOT' >> $GITHUB_ENV
          
      - name: Post text to a Slack channel
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_APP_SECRET }}
          payload: |
            channel: C04PGT140DD
            text: |
            ${{ github.env.message}}